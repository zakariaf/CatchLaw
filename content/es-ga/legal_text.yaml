    body: |-
      Artigo 6. Dos moluscos

      1. Os tamaños mínimos dos moluscos son os que se recollen no anexo I-B
      desta orde.

      4. O tamaño medirase tal e como se indica no anexo II-B e da seguinte
      maneira: a) No caso dos moluscos bivalvos, medindo o eixe maior ou
      anteroposterior (LAP), excepto a ostra e a ostra rizada, que se medirán no
      eixe dorsoventral (LDV).
