# Validates the repository's own contracts. Deliberately dependency-free: this
# repo carries a spec, a design system and Claude Code skills — not app code yet.
# When the Flutter app lands, add an analyze/test job beside these.
name: validate

on:
  push:
    branches: [main]
  pull_request:

# A force-push must not leave two runs racing on the same ref.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skills:
    name: skills contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts parse
        run: |
          shopt -s nullglob
          found=0
          for f in .claude/skills/*/scripts/*.sh tools/gates/*.sh; do
            found=1
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; exit 1; }
          done
          [ "$found" = 1 ] && echo "all scripts parse" || echo "no scripts found"

      # Scoped to the skills THIS repository authors. CLAUDE.md keeps two
      # registries apart: the sixteen catchlaw-*/lonja-* skills carry token
      # values and app-domain law and are owned here; the 33 general Flutter
      # skills are vendored from the flutter@flutter-skills plugin and are
      # maintained upstream, where their authoring rules live. Nine of them fail
      # this contract — two carry an unquoted ": " that makes the frontmatter
      # parse to nothing, two declare disable-model-invocation, five use < or >
      # — and CLAUDE.md already records that those corrections belong in the
      # plugin repository rather than here. Gating on them would mean editing
      # vendored content to make our build pass.
      - name: Frontmatter parses to exactly name + description
        run: |
          python3 - <<'PY'
          import glob, sys, yaml, os
          bad = []
          paths = sorted(glob.glob('.claude/skills/catchlaw-*/SKILL.md')
                         + glob.glob('.claude/skills/lonja-*/SKILL.md'))
          if len(paths) != 16:
              print(f'expected 16 app skills, found {len(paths)}'); sys.exit(1)
          for p in paths:
              d = os.path.basename(os.path.dirname(p))
              raw = open(p, encoding='utf-8').read()
              try:
                  fm = yaml.safe_load(raw.split('---')[1]) or {}
              except Exception as e:
                  bad.append(f'{d}: YAML error — {str(e)[:80]}'); continue
              if sorted(fm) != ['description', 'name']:
                  bad.append(f'{d}: keys are {sorted(fm)}, expected [description, name]')
              if fm.get('name') != d:
                  bad.append(f"{d}: frontmatter name is {fm.get('name')!r}")
              n = len(fm.get('description', ''))
              if not 200 <= n <= 1024:
                  bad.append(f'{d}: description is {n} chars')
              if '<' in fm.get('description','') or '>' in fm.get('description',''):
                  bad.append(f'{d}: description contains < or >')
          print('\n'.join(bad) if bad else f'{len(paths)} app skills OK')
          sys.exit(1 if bad else 0)
          PY

      - name: No dangling bundled-file citations
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          bad = []
          for p in sorted(glob.glob('.claude/skills/*/SKILL.md')):
              d = os.path.dirname(p)
              t = open(p, encoding='utf-8').read()
              for c in sorted(set(re.findall(r'`((?:references|examples|scripts)/[A-Za-z0-9_.-]+)`', t))):
                  if not os.path.exists(os.path.join(d, c)):
                      bad.append(f'{os.path.basename(d)} cites missing {c}')
          print('\n'.join(bad) if bad else 'no dangling citations')
          sys.exit(1 if bad else 0)
          PY

  invariants:
    name: product invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The verdict must never read as an instruction. This is a legal boundary,
      # not a copy preference — see .claude/skills/catchlaw-verdict-contract/.
      # Scoped to app source so the skills may quote the banned words as examples.
      - name: No imperative verdict strings in app source
        run: |
          if [ ! -d lib ] && [ ! -d app ]; then
            echo "no app source yet — skipping"; exit 0
          fi
          hits=$(grep -rniE '"(keep|return|throw it back|put it back)[.!"]' \
                   --include='*.dart' --include='*.arb' lib app 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::imperative verdict string found — the result must state a fact"
            echo "$hits"; exit 1
          fi
          echo "no imperative verdict strings"

      - name: No networking dependency
        run: |
          if [ ! -f pubspec.yaml ]; then echo "no pubspec yet — skipping"; exit 0; fi
          hits=$(grep -nE '^\s+(http|dio|web_socket_channel|grpc|connectivity_plus):' pubspec.yaml || true)
          if [ -n "$hits" ]; then
            echo "::error::networking package declared — CatchLaw has no network code path"
            echo "$hits"; exit 1
          fi
          echo "no networking dependency declared"

  flutter:
    name: format · analyze · test
    runs-on: ubuntu-24.04            # pinned, not -latest: image drift moves the toolchain
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4                 # VERIFY: confirm the current major
      - uses: subosito/flutter-action@v2          # v2 is current; there is no v3
        with:
          channel: stable
          flutter-version-file: .fvmrc            # D-5 — one recorded version, local == CI
          cache: true
          pub-cache: true

      - run: flutter --version
      - run: dart pub get                         # ONCE, at the workspace root

      - name: Exactly one lockfile, at the root
        run: |
          n=$(find . -name pubspec.lock -not -path './.dart_tool/*' | wc -l | tr -d ' ')
          [ "$n" = 1 ] || { echo "::error::$n pubspec.lock files — a pub get ran inside a member"; exit 1; }

      # SPEC.md §14 static block, bullet 1. Edge-level, not package-level: §5.3
      # records that "no HTTP client is linked" was FALSE, so the guarantee is
      # that http has exactly the two parents §14 names.
      - name: Direct-dependency allowlist diff (SPEC §14)
        run: dart pub deps --json | python3 tools/gates/check_dependency_allowlist.py --allowlist-dir tools/gates/allowlist

      # D-8. SPEC.md §9.3 calls this a lint rule; there is none in package:lints,
      # flutter_lints or the analyzer's built-in set. The ban lives here rather
      # than only in the i18n-rtl-l10n plugin for three reasons a plugin script
      # cannot cover: a required check must not depend on a separately-versioned
      # checkout; SPEC.md §9.3's one exception — the ruler, which must not
      # mirror — is this product's carve-out and needs a local escape hatch; and
      # the gate has to FAIL when it scans zero files.
      #
      # The plugin's own check runs beside it, not instead of it: the general
      # rule stays the plugin's and is not forked. It needs its own step because
      # run_skill_gates.sh walks `.claude/skills/` and D-13 deliberately keeps
      # the vendored general skills in `.claude/skills-flutter/`.
      - name: No physical-side geometry in app/lib (D-8)
        run: bash tools/gates/no_directional_geometry.sh app/lib

      - name: i18n bans (the plugin's general rule, unforked)
        run: bash .claude/skills-flutter/i18n-rtl-l10n/scripts/check_i18n_bans.sh app/lib

      # SPEC.md §14 static row 5 / §13 "Localisation completeness". Key and
      # placeholder parity is general Flutter practice and keeps its maintained
      # implementation in the plugin (catchlaw-conventions-index rule 10); the
      # CLDR plural-category table is app law and is a Dart test inside the app
      # suite, because an ICU message needs parsing and a grep for `many` hits
      # the word inside a translation.
      #
      # The path is written out. D-1: the gate exits 2 on a missing target, so a
      # bare default aborts at this repo root instead of scanning app/lib/l10n.
      - name: ARB key and placeholder parity (SPEC §14 row 5)
        run: bash .claude/skills-flutter/i18n-rtl-l10n/scripts/check_arb_parity.sh app/lib/l10n

      # FLUTTER_GUIDE.md §7.4 commits generated Dart, and `flutter test` honours
      # `generate: true` — so it regenerates the localisations and runs against
      # the fresh output while git keeps the stale one. Every other check in
      # this job would stay green over an ARB edit whose Dart was never
      # regenerated, and the fisher who finds out is the one whose clone will
      # not analyse. Regenerating and diffing is the only step that looks at
      # what is committed rather than at what was rebuilt.
      - name: Committed gen-l10n output is current
        run: |
          cd app && flutter gen-l10n
          cd .. && git diff --exit-code -- app/lib/l10n/gen \
            || { echo "::error::app/lib/l10n/gen is stale — run 'cd app && flutter gen-l10n' and commit"; exit 1; }

      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos

      # D-12. `flutter analyze` loads analyzer plugins on ubuntu-24.04 but NOT
      # on a local macOS checkout, measured both ways — so `dart analyze` is run
      # as well, because it is the command that loads them everywhere. Neither
      # is informational: both block. A plugin lane that cannot fail is the
      # decoration FLUTTER_GUIDE Part 4.1 fact 2 warns about.
      - name: Analyze with plugins
        run: dart analyze

      # SPEC.md §14 static block, bullet 2. A shell step and not only the guard
      # test, because a release checklist item most needs answering when the Dart
      # suite is the thing that is broken. The two are not redundant: the test
      # walks files, skips generated output and reports file and line; this runs
      # when nothing compiles.
      - name: Banned network APIs (SPEC §14)
        run: bash tools/gates/no_banned_apis.sh app/lib

      # All sixteen skill gates, each against the directory D-1, D-2 and D-4 say
      # it must actually read, with the scanned-file count printed for every row.
      # The count is the point: every check_*.sh is a `grep -r ... || true`, so a
      # target that exists and holds nothing prints OK and exits 0. A green tick
      # meaning "I found nothing" and one meaning "I looked at nothing" are the
      # same pixel, and this repository's offline claim is read off those greens.
      - name: Skill gates (all sixteen, with a non-empty scan asserted)
        run: bash tools/gates/run_skill_gates.sh tools/gates/skill_gates.tsv

      # On Linux `flutter test` runs in a plain Dart VM where sqlite3_flutter_libs
      # does nothing, so an E05 database suite fails in a way that reads as a
      # broken repository. Four seconds now removes that whole class of failure.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      # The suite set is stated in tools/gates/ci_members.txt and asserted by
      # app/test/policy/ci_workflow_test.dart.
      - name: rule_engine suite
        run: cd packages/rule_engine && dart test --test-randomize-ordering-seed random --reporter expanded
      - name: content_builder suite
        run: cd tools/content_builder && dart test --test-randomize-ordering-seed random --reporter expanded

      # reference.db is git-ignored (D-6: the .gz is what ships), so CI builds
      # it before the app suite. E05/T01's parity test reads the REAL file —
      # drift's Table classes and the content builder's DDL are two
      # descriptions of one schema, and only the built file can prove they
      # agree. The date is fixed so the build stays reproducible.
      - name: Build reference.db for the app suite
        run: |
          dart run content_builder:build \
            --in content/ --out app/assets/db/reference.db \
            --build-date 2026-08-14 --generator-commit "$(git rev-parse --short HEAD)"
      # The everyday lane. Goldens are excluded because font rasterisation,
      # subpixel positioning and antialiasing differ per host and per engine
      # revision (FLUTTER_GUIDE.md §6.4 point 2) — an unexcluded golden churns
      # on every machine that is not the one lane below.
      - name: app suite
        run: cd app && flutter test --exclude-tags golden --test-randomize-ordering-seed random --reporter expanded

  goldens:
    name: goldens (linux only)
    runs-on: ubuntu-24.04            # ONE host is the source of truth, or the files never stop moving
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - run: dart pub get

      # The golden lane pumps the real app root, which reaches no database —
      # but flutter_test_config.dart runs for every file in app/test/, so the
      # asset bundle has to exist. Building it here keeps this job independent
      # of the one above rather than ordered behind it.
      - name: Build reference.db for the golden lane
        run: |
          dart run content_builder:build \
            --in content/ --out app/assets/db/reference.db \
            --build-date 2026-08-14 --generator-commit "$(git rev-parse --short HEAD)"

      # No --update-goldens, here or anywhere. A blessing step turns the suite
      # into a ratchet that approves whatever shipped; regeneration is a
      # deliberate, reviewed, local act with a titled commit.
      - name: Golden lane
        run: cd app && flutter test --tags golden --reporter expanded

      # E07's six Lonja gates. E01 wired the sixteen skill gates as a set; these
      # are named individually here because this is the first epic in which they
      # have anything to find — check_lonja_tokens.sh app/lib was green from E01
      # over a tree with almost no colour in it, and a gate that scans an empty
      # path reports success (CONVENTIONS.md §7). gate_targets_test.dart asserts
      # the targets are non-empty; only then is a green worth reading.

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: app/test/**/failures/
          retention-days: 14

  android-release-manifest:
    name: android release manifest
    needs: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4                 # VERIFY: confirm the current major
      - uses: actions/setup-java@v4               # VERIFY: confirm the current major
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: dart pub get

      # Unsigned on purpose. CI proves the artefact builds and what its manifest
      # says; signing belongs to a human or a secrets-scoped release workflow, and
      # a job with no signing secret has nothing to leak.
      - run: cd app && flutter build appbundle --release

      # SPEC.md §14 bullet 3 names `aapt2 dump xmltree` on the AAB. aapt2 CANNOT
      # read an AAB — it answers "could not identify format of APK" and exits, and
      # a `grep -q INTERNET` over that error text finds nothing and reports success.
      # apkanalyzer is worse: it printed an ERROR and still exited 0. bundletool is
      # the tool four-layers.md names for a bundle and the only one of the three
      # that actually reads it. Pinned, because an unpinned tool is a second thing
      # that can change the answer.
      - name: Fetch bundletool 1.18.1
        run: curl -sSL --fail -o "$RUNNER_TEMP/bundletool.jar"
          https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Merged release manifest grants no INTERNET and no background location
        run: |
          set -euo pipefail
          AAB=app/build/app/outputs/bundle/release/app-release.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > merged-manifest.xml
          # Prove the dump produced a manifest BEFORE trusting any grep over it.
          # Every silent-pass this task uncovered had the same shape: a tool failed,
          # wrote its error where the manifest should have been, and the greps below
          # found nothing and called it a pass.
          grep -q '<manifest' merged-manifest.xml || {
            echo "::error::the dump produced no manifest — refusing to pass over it"
            cat merged-manifest.xml; exit 1; }
          for perm in android.permission.INTERNET android.permission.ACCESS_BACKGROUND_LOCATION; do
            if grep -q "$perm" merged-manifest.xml; then
              echo "::error::$perm is present in the MERGED release manifest"
              grep -n "$perm" merged-manifest.xml
              exit 1
            fi
          done
          grep -q 'android:allowBackup="false"' merged-manifest.xml || {
            echo "::error::allowBackup is not false in the merged manifest"; exit 1; }
          echo "merged release manifest: no INTERNET, no background location, allowBackup=false"

      # Read once so the baseline is known before a plugin ever adds a grant. At
      # E01 it reads: uses-permission#android.permission.INTERNET ADDED from main,
      # then REJECTED — the remove marker doing its job.
      - uses: actions/upload-artifact@v4          # VERIFY: confirm the current major
        with:
          name: manifest-merger-release-report
          path: app/build/app/outputs/logs/manifest-merger-release-report.txt
          retention-days: 14
