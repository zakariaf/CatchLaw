name: analysis_defaults
description: >-
  The lint configuration every workspace member includes as a dev dependency.
  It ships one dependency and no Dart: its whole job is to make
  `package:flutter_lints/flutter.yaml` resolvable from one place.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # The floor the root analysis_options.yaml is built on. Held here so an
  # upgrade is one line rather than four (FLUTTER_GUIDE.md Part 2.4, following
  # flutter/samples).
  flutter_lints: ^6.0.0
