# A nested options file REPLACES the parent for its subtree. Without this line
# the package silently loses strict-casts, every promoted error and every rule
# in FLUTTER_GUIDE.md Part 4.3's list — and `dart analyze` here would report
# zero problems, which is also what a clean package looks like. (Verified.)
include: ../../analysis_options.yaml

analyzer:
  errors:
    # check_no_network.sh requires this promoted to error HERE and not merely at
    # the root, and the reason is specific to this package rather than general
    # hygiene: an import of a package that is only a TRANSITIVE dependency
    # compiles perfectly well, so a file under lib/ could import a package this
    # pubspec never declared — an http edge reached through somebody else's
    # dependency, invisible to the §14 direct-dependency allowlist because no
    # line was ever added to a pubspec for a reviewer to see.
    depend_on_referenced_packages: error

linter:
  rules:
    # Two consumers — the app and the content builder — make an undocumented
    # public member real debt rather than a style preference.
    - public_member_api_docs
    - avoid_print
