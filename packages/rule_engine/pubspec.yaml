name: rule_engine
description: >-
  Pure-Dart rule resolution shared by the app and the content builder. The
  absence of a flutter dependency below is the purity guarantee, not an
  oversight: importing the Flutter framework here is a compile error.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # Every runtime dependency here is a thing a reviewer must reason about before
  # believing the engine is pure, so there are two and each earns its place.
  meta: ^1.15.0
  # SPEC.md §9.4 opens with NFKC and the Latin fold needs NFD; dart:core offers
  # neither. Chosen against E02/T02's four criteria: it declares NO runtime
  # dependencies at all, names no dart:io symbol, covers the full Unicode range
  # (17.0, all four forms) rather than a Latin subset, and resolves on D-5's
  # toolchain. A Latin-only strip table would pass every §9.4 example and fail
  # the first decomposed paste out of a gazette PDF.
  unorm_dart: ^0.3.2

dev_dependencies:
  # Workspace-resolved: it makes package:flutter_lints/flutter.yaml load for
  # this member's analysis_options.yaml.
  analysis_defaults:
  # Plain `dart test`, never flutter_test — that would forfeit the headless
  # millisecond tier this package exists to keep.
  test: ^1.25.0
