name: catchlaw
description: >-
  CatchLaw — an offline catch-legality reference. Ships no network code path.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # The Global* delegates of SPEC.md §9.3. They are what map a resolved locale
  # to a TextDirection, which is why no Directionality is constructed anywhere
  # in app/lib — RTL is a consequence of `ar`, never a switch.
  flutter_localizations:
    sdk: flutter

  # NumberFormat and the numeral-system lever of §9.3. Deliberately unpinned:
  # flutter_localizations pins intl exactly, so a caret here resolves to a
  # conflict rather than to a choice. SPEC.md §10's `^0.19` is a floor the SDK
  # already exceeds; E06/T04 asserts the emitted digit block rather than the
  # version, so whichever one resolves, the test states the truth.
  intl: any

  # D-5 pins the version; D-12 is why it arrives in E01 rather than later.
  flutter_riverpod: ^3.4.1

  # The Result/Failure spine, the §7.3 resolution and the §9.4 fold. Resolved by
  # the workspace, not by a path: + dependency_overrides pair, so the app and
  # the content builder provably share one engine.
  rule_engine:

  # D-5 pins drift at 2.34.2. EXACTLY 2.34.2, not ^2.34.2: a caret is not a pin,
  # and the difference is load-bearing — drift 2.34.3 moved an internal the
  # generator's `schema dump` tool reaches for, and drift_dev cannot be moved
  # forward to match because 2.34.1+ requires an analyzer this workspace cannot
  # give package:test.
  #
  # SPEC.md §10 chose drift over sqflite, Isar and Hive deliberately: §7.3's
  # resolution is genuinely relational and needs real SQL with indices, and
  # drift is the only one of the four that gives two independent database
  # instances in one app.
  drift: 2.34.2

  # sqlite3_flutter_libs bundles a modern SQLite with FTS5 compiled in; without
  # it the legal-text search of S13 has no tokeniser at all.
  sqlite3: ^3.4.0
  sqlite3_flutter_libs: ^0.5.0

  # The support directory, per catchlaw-reference-database's ownership matrix.
  # NOT documents (user-visible on iOS, so the fisher can delete the rule book
  # by tidying up) and NOT temporary or cache (reclaimed under storage pressure
  # without the app running — the worst possible home for the file whose entire
  # value is answering with no signal).
  path: ^1.9.0
  path_provider: ^2.1.5

  # @visibleForTesting on the one createAll() seam. Same annotation package the
  # engine uses.
  meta: ^1.15.0

  # AccumulatorSink, for hashing the payload as it streams rather than after it
  # lands. A ~10 MB decompressed buffer on SPEC.md §13's 2 GB device is the
  # anti-pattern this whole installer exists to avoid.
  convert: ^3.1.2

  # The extraction integrity check of D-6. The content builder writes the same
  # digest into reference.build.json, so the two halves agree on the algorithm
  # and not merely on the word.
  crypto: ^3.0.6

dev_dependencies:
  # Workspace-resolved: it makes package:flutter_lints/flutter.yaml load for
  # this member's analysis_options.yaml.
  analysis_defaults:
  flutter_test:
    sdk: flutter
  # Pure Dart, opens nothing, dev-only: the policy tests parse five pubspecs,
  # and regex-scanning YAML is how a policy test starts passing for the wrong
  # reason.
  yaml: ^3.1.2

  # Generates the drift row and companion classes. Generated files are
  # COMMITTED (FLUTTER_GUIDE.md §7.4) — a fresh clone must analyse without
  # running a builder first.
  build_runner: ^2.4.13

  # PINNED ONE PATCH BEHIND THE RUNTIME, and the reason is a real constraint
  # rather than caution. D-5 pins drift 2.34.2; drift_dev 2.34.1 and later
  # require `analyzer ^13.0.0`, while flutter_test pins test_api 0.7.11, which
  # forces `package:test` 1.31.0, which caps analyzer below 13. One workspace is
  # one resolution, so the generator must be the last version that accepts an
  # analyzer this workspace can also give `package:test`. 2.34.0 generates for
  # drift >=2.30.0 <2.35.0, so the runtime pin D-5 sets is unaffected.
  drift_dev: '>=2.34.0 <2.34.1'

flutter:
  uses-material-design: true

  # gen-l10n refuses to run without it, and `flutter run` regenerates from the
  # ARB on top of the committed output rather than instead of it: synthetic
  # packages are gone on 3.44.6, so `output-dir: lib/l10n/gen` is a real
  # directory in the tree and stays diffable.
  generate: true

  assets:
    # The shipping rule book (D-6 item 1). The uncompressed reference.db is
    # git-ignored and is a build artefact; this is the file that goes into the
    # bundle and is extracted once, verified by sha256, and opened read-only.
    - assets/db/reference.db.gz
    # What the extraction verifies against: build id, date, uncompressed byte
    # count and uncompressed sha256.
    - assets/db/reference.build.json
    # What the installer reads for the determinate bar's denominator, and what
    # E18's "about the rule book" screen reads for the counts — neither of
    # which should require opening ten megabytes of SQLite.
    - assets/content_build.json
