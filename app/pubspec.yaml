name: catchlaw
description: >-
  CatchLaw — an offline catch-legality reference. Ships no network code path.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # D-5 pins the version; D-12 is why it arrives in E01 rather than later.
  flutter_riverpod: ^3.4.1

  # D-5 pins drift at 2.34.2. SPEC.md §10 chose it over sqflite, Isar and Hive
  # deliberately: §7.3's resolution is genuinely relational and needs real SQL
  # with indices, and drift is the only one of the four that gives two
  # independent database instances in one app.
  drift: ^2.34.2

  # sqlite3_flutter_libs bundles a modern SQLite with FTS5 compiled in; without
  # it the legal-text search of S13 has no tokeniser at all.
  sqlite3: ^3.4.0
  sqlite3_flutter_libs: ^0.5.0

  # The support directory, per catchlaw-reference-database's ownership matrix.
  # NOT documents (user-visible on iOS, so the fisher can delete the rule book
  # by tidying up) and NOT temporary or cache (reclaimed under storage pressure
  # without the app running — the worst possible home for the file whose entire
  # value is answering with no signal).
  path: ^1.9.0
  path_provider: ^2.1.5

  # @visibleForTesting on the one createAll() seam. Same annotation package the
  # engine uses.
  meta: ^1.15.0

  # The extraction integrity check of D-6. The content builder writes the same
  # digest into reference.build.json, so the two halves agree on the algorithm
  # and not merely on the word.
  crypto: ^3.0.6

dev_dependencies:
  # Workspace-resolved: it makes package:flutter_lints/flutter.yaml load for
  # this member's analysis_options.yaml.
  analysis_defaults:
  flutter_test:
    sdk: flutter
  # Pure Dart, opens nothing, dev-only: the policy tests parse five pubspecs,
  # and regex-scanning YAML is how a policy test starts passing for the wrong
  # reason.
  yaml: ^3.1.2

  # Generates the drift row and companion classes. Generated files are
  # COMMITTED (FLUTTER_GUIDE.md §7.4) — a fresh clone must analyse without
  # running a builder first.
  build_runner: ^2.4.13

  # PINNED ONE PATCH BEHIND THE RUNTIME, and the reason is a real constraint
  # rather than caution. D-5 pins drift 2.34.2; drift_dev 2.34.1 and later
  # require `analyzer ^13.0.0`, while flutter_test pins test_api 0.7.11, which
  # forces `package:test` 1.31.0, which caps analyzer below 13. One workspace is
  # one resolution, so the generator must be the last version that accepts an
  # analyzer this workspace can also give `package:test`. 2.34.0 generates for
  # drift >=2.30.0 <2.35.0, so the runtime pin D-5 sets is unaffected.
  drift_dev: '>=2.34.0 <2.34.1'
