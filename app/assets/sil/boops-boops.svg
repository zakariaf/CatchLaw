<!-- Boops boops (Galician: Boga) — schematic side-view silhouette.
     Originated line art drawn for CatchLaw from morphological description;
     not traced, copied or derived from any copyrighted illustration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none" stroke="#16201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <!-- back: snout over the nape and along the dorsal ridge to the caudal peduncle -->
  <path d="M150 45 C128 33 105 27 82 27 C64 27 50 31 42 35 C32 40 22 47 18 53" />
  <!-- belly: snout under the head and along the ventral line to the peduncle -->
  <path d="M18 53 C24 59 32 64 44 67 C66 72 106 70 128 63 C140 59 146 56 150 57" />

  <!-- mouth: small terminal gape at the snout tip -->
  <path d="M18 53 C22 55 25 56 29 56" />

  <!-- large eye, set well forward in the head -->
  <ellipse cx="33" cy="48" rx="5.4" ry="5.4" />
  <ellipse cx="33" cy="48" rx="1.4" ry="1.4" />

  <!-- gill cover -->
  <path d="M44 35 C50 44 50 58 45 66" />

  <!-- single continuous dorsal fin, long and low, spiny front to soft rear -->
  <path d="M57 29 L68 15 C92 12 116 17 130 37" />
  <line x1="70" y1="16" x2="70" y2="28" />
  <line x1="86" y1="13" x2="86" y2="27" />
  <line x1="102" y1="14" x2="102" y2="29" />
  <line x1="116" y1="18" x2="117" y2="32" />

  <!-- pectoral fin -->
  <path d="M48 52 C62 55 74 62 82 70 C70 67 58 62 48 58" />

  <!-- pelvic fin -->
  <polyline points="62,70 68,82 76,71" />

  <!-- anal fin -->
  <polyline points="112,68 120,82 134,62" />

  <!-- lateral line -->
  <path d="M46 42 C80 40 116 44 148 49" />

  <!-- deeply forked caudal fin -->
  <polyline points="150,45 186,27 175,50 186,73 150,57" />

</svg>
