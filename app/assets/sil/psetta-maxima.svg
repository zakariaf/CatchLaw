<!--
  Psetta maxima (turbot; Galician: rodaballo) — schematic left-facing silhouette.
  Originated line art drawn for CatchLaw from morphological description.
  Not traced, copied or derived from any copyrighted illustration or photograph.
  Features carried: near-circular flattened disc, both eyes on the left (eyed)
  side, dorsal and anal fins fringing almost the whole rim, short truncate tail,
  scattered bony tubercles, lateral line arched over the pectoral.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <g fill="none" stroke="#16201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- outer margin: body disc plus the dorsal and anal fin fringe -->
    <path d="M 16 54
             C 17 43, 23 34, 31 29
             C 52 12, 92 6, 120 15
             C 136 20, 146 30, 150 40
             L 150 60
             C 146 70, 136 80, 120 85
             C 92 94, 52 88, 31 71
             C 23 66, 17 61, 16 54 Z" />

    <!-- dorsal fin base: runs forward onto the head, ahead of the upper eye -->
    <path d="M 30 40 C 52 26, 90 20, 118 27 C 132 31, 142 36, 149 43" />
    <!-- anal fin base -->
    <path d="M 38 74 C 58 84, 92 84, 118 76 C 132 71, 143 65, 149 58" />

    <!-- dorsal fin rays -->
    <line x1="36" y1="36" x2="34" y2="26" />
    <line x1="49" y1="31" x2="50" y2="18" />
    <line x1="61" y1="28" x2="61" y2="14" />
    <line x1="72" y1="26" x2="73" y2="12" />
    <line x1="84" y1="25" x2="85" y2="11" />
    <line x1="95" y1="24" x2="97" y2="11" />
    <line x1="109" y1="25" x2="111" y2="14" />
    <line x1="126" y1="29" x2="130" y2="19" />
    <line x1="140" y1="35" x2="145" y2="27" />

    <!-- anal fin rays -->
    <line x1="44" y1="76" x2="41" y2="83" />
    <line x1="55" y1="79" x2="53" y2="86" />
    <line x1="65" y1="81" x2="64" y2="88" />
    <line x1="76" y1="82" x2="75" y2="89" />
    <line x1="87" y1="82" x2="86" y2="90" />
    <line x1="97" y1="80" x2="97" y2="89" />
    <line x1="108" y1="79" x2="109" y2="87" />
    <line x1="121" y1="75" x2="124" y2="83" />
    <line x1="136" y1="68" x2="141" y2="75" />

    <!-- short truncate tail -->
    <path d="M 150 40 C 160 38, 168 34, 175 29 C 182 42, 182 58, 175 71 C 168 66, 160 62, 150 60" />
    <line x1="154" y1="45" x2="177" y2="37" />
    <line x1="154" y1="50" x2="180" y2="50" />
    <line x1="154" y1="55" x2="177" y2="63" />

    <!-- gill cover -->
    <path d="M 41 31 C 48 42, 48 60, 42 74" />

    <!-- large oblique mouth -->
    <path d="M 17 51 C 22 55, 26 58, 31 60" />
    <path d="M 18 57 C 22 59, 26 61, 31 62" />

    <!-- both eyes on the left (upper) side, close together above the mouth -->
    <ellipse cx="28" cy="46" rx="4" ry="3.4" />
    <ellipse cx="28" cy="46" rx="1" ry="1" />
    <ellipse cx="37" cy="38" rx="4" ry="3.4" />
    <ellipse cx="37" cy="38" rx="1" ry="1" />

    <!-- lateral line, arched over the pectoral -->
    <path d="M 45 51 C 55 42, 68 41, 78 47 C 95 56, 120 54, 147 49" />

    <!-- pectoral fin -->
    <path d="M 50 56 C 60 57, 68 60, 72 66 C 64 68, 55 65, 50 62" />
    <line x1="55" y1="58" x2="63" y2="66" />
    <line x1="62" y1="60" x2="67" y2="66" />

    <!-- scattered bony tubercles -->
    <ellipse cx="86" cy="36" rx="1.6" ry="1.6" />
    <ellipse cx="105" cy="43" rx="1.6" ry="1.6" />
    <ellipse cx="76" cy="63" rx="1.6" ry="1.6" />
    <ellipse cx="99" cy="70" rx="1.6" ry="1.6" />
    <ellipse cx="120" cy="62" rx="1.6" ry="1.6" />

  </g>
</svg>
