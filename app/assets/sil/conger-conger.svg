<!-- Conger conger (European conger; Galician: Congro). Originated schematic line
     art drawn for CatchLaw from morphological description; not traced from,
     derived from, or copied from any copyrighted illustration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <g fill="none" stroke="#16201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- dorsal profile: blunt head, very long snake-like trunk tapering to a pointed tail -->
    <path d="M16,52 C20,44 28,39.5 40,39 C70,35 100,38 130,42 C152,45 172,50 186,54"/>

    <!-- ventral profile -->
    <path d="M16,52 C20,58 26,61 40,61 C70,64 100,64.5 130,60 C152,57 172,55.5 186,54"/>

    <!-- continuous dorsal fin: originates just behind the head and runs unbroken into the tail tip -->
    <path d="M46,38.6 C52,30 60,29 72,29.6 C100,30.6 130,36 152,42 C168,46 178,50.4 186,54"/>

    <!-- continuous anal fin: runs unbroken into the same tail tip -->
    <path d="M88,63.6 C96,71 110,72 130,69 C150,66 172,59 186,54"/>

    <!-- long gape reaching back past the eye -->
    <path d="M16,52.6 C22,54.6 30,55.6 37,55.4"/>

    <!-- eye -->
    <ellipse cx="27.5" cy="48" rx="2.4" ry="2.4"/>

    <!-- gill opening, low on the side just before the pectoral -->
    <path d="M39,46.5 C41,51 41,56 39,59.5"/>

    <!-- small rounded pectoral fin; no pelvic fins at all -->
    <path d="M43,55.5 C48,58 52.5,61.5 55,64 C51.5,63.5 47,61 43.5,58"/>

  </g>
</svg>
