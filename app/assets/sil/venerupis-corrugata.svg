<!-- Venerupis corrugata, right valve, exterior. Originated line art for
     CatchLaw (SPEC.md §8): drawn from the outline in the Xunta's own tallas
     mínimas plate rather than traced from any copyrighted illustration, and
     deliberately schematic — it identifies the shape of a clam, and the app
     never asks a fisher to identify a species from it alone.

     The double-headed arrow is the anteroposterior axis (LAP), which is what
     Artigo 6.4(a) of the 2012 order measures. -->
