<!--
  Solea solea / Solea spp. (common sole; Galician: Linguados).
  Originated schematic line art drawn for CatchLaw from morphological
  description alone. Not traced, copied or derived from any copyrighted
  illustration, photograph or field-guide plate.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <g fill="none" stroke="#16201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- body: flatfish, long asymmetric oval, blunt rounded snout, narrow peduncle.
         The outline IS the outer fin margin: dorsal and anal fins run the whole
         length of the body from the head to the tail. -->
    <path d="M24 40
             C34 26 52 20 78 19
             C110 18 142 28 160 42
             L160 58
             C142 72 110 82 78 81
             C52 80 34 74 24 60
             C15 55 15 45 24 40 Z"/>

    <!-- dorsal fin base: begins on the head, unbroken to the tail -->
    <path d="M22 47 C34 36 56 29 80 27 C108 26 136 34 154 45"/>

    <!-- anal fin base: mirrors the dorsal, unbroken to the tail -->
    <path d="M23 55 C34 67 56 74 80 75 C108 76 136 68 154 55"/>

    <!-- dorsal fin rays -->
    <path d="M45 31 L45 25"/>
    <path d="M65 27.5 L65 21"/>
    <path d="M85 26 L85 20"/>
    <path d="M105 26.5 L105 20.5"/>
    <path d="M125 30 L125 24"/>
    <path d="M145 39 L145 34"/>

    <!-- anal fin rays -->
    <path d="M45 69 L45 75"/>
    <path d="M65 73 L65 79"/>
    <path d="M85 76 L85 80"/>
    <path d="M105 75.5 L105 79.5"/>
    <path d="M125 72 L125 76"/>
    <path d="M145 63 L145 67"/>

    <!-- both eyes on the same (right) side, close together, set well forward -->
    <ellipse cx="31" cy="46" rx="3.6" ry="3.4"/>
    <ellipse cx="42" cy="38" rx="3.6" ry="3.4"/>

    <!-- small curved mouth, low and set back under the overhanging snout -->
    <path d="M16 53 C20 57 25 58 30 57"/>

    <!-- gill opening -->
    <path d="M50 25 C54 38 54 58 50 71"/>

    <!-- small pectoral fin on the eyed side -->
    <path d="M55 47 C63 44 69 47 67 53 C64 57 58 55 55 52"/>

    <!-- lateral line: nearly straight along the flank -->
    <path d="M60 50 C90 49 122 49 152 49"/>

    <!-- small rounded caudal fin, joined close to the fin margins -->
    <path d="M160 42 C174 40 184 44 185 50 C184 56 174 60 160 58"/>

  </g>
</svg>
